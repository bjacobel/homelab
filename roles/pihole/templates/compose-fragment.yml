pihole:
  container_name: pihole
  image: pihole/pihole:2026.05.0
  ports:
    - 53:53/tcp
    - 53:53/udp
    - 67:67/udp
  expose:
    - "80"
  environment:
    TZ: 'America/New_York'
    FTLCONF_dns_specialDomains_iCloudPrivateRelay: 'true'
    FTLCONF_database_maxDBdays: 60
    FTLCONF_dns_listeningMode: 'ALL'
    FTLCONF_webserver_api_password: 'pihole' # useless extra login screen behind authelia
  ulimits:
    nofile:
      soft: 1024
      hard: 4096
  networks:
    - default
  volumes:
    - pihole-data:/etc/pihole/
  dns:
    - 127.0.0.1
  labels:
    - docker-volume-backup.stop-during-backup=true
